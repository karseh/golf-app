pluginManagement {
  def nodeCmd = new File("/opt/homebrew/bin/node").exists() ? "/opt/homebrew/bin/node" : (new File("/usr/local/bin/node").exists() ? "/usr/local/bin/node" : "node")
  def version = [nodeCmd, "-e", "console.log(require('react-native/package.json').version);"].execute(null, rootDir).text.trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }

  includeBuild(new File([nodeCmd, "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim()).getParentFile().toString())
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}

plugins { id("com.facebook.react.settings") }

try {
  def pe = Class.forName("java.lang.ProcessEnvironment")
  def varClass = Class.forName("java.lang.ProcessEnvironment\$Variable")
  def valClass = Class.forName("java.lang.ProcessEnvironment\$Value")
  def varValueOf = varClass.getDeclaredMethod("valueOf", String.class)
  def valValueOf = valClass.getDeclaredMethod("valueOf", String.class)
  varValueOf.setAccessible(true)
  valValueOf.setAccessible(true)

  def f1 = pe.getDeclaredField("theEnvironment")
  f1.setAccessible(true)
  def envMap = (Map) f1.get(null)
  
  def pathVar = varValueOf.invoke(null, "PATH")
  def existingVal = envMap.get(pathVar)?.toString() ?: ""
  if (!existingVal.contains("/opt/homebrew/bin")) {
    def newPathVal = valValueOf.invoke(null, "/opt/homebrew/bin:/usr/local/bin:" + existingVal)
    envMap.put(pathVar, newPathVal)
  }
} catch (Throwable ignored) {}

def getNodeBinary() {
  if (new File("/opt/homebrew/bin/node").exists()) return "/opt/homebrew/bin/node"
  if (new File("/usr/local/bin/node").exists()) return "/usr/local/bin/node"
  return "node"
}
def nodeCmd = getNodeBinary()

def getRNMinorVersion(cmd) {
  def version = [cmd, "-e", "console.log(require('react-native/package.json').version);"].execute(null, rootDir).text.trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return minor
}

if (getRNMinorVersion(nodeCmd) >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('\u001B[32mUsing expo-modules-autolinking as core autolinking source\u001B[0m')
      def command = [
        nodeCmd,
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}

